name: Hypersonica
description: Hypersonica is a European defence and aerospace company developing sovereign hypersonic
  strike systems for both military and civilian applications. Founded to give Europe an independent
  technological edge to deter aggression, the company tested what it describes as Europe's first
  sovereign hypersonic missile prototype in February 2026, focusing on fast, modular, maneuverable
  deep-strike capabilities delivered in months rather than years at a claimed 80% cost reduction.
  Headquartered in Munich with UK offices, Hypersonica raised a EUR 23.3M Series A backed by Plural,
  SPRIND, and General Catalyst. As a business-to-government defence contractor it publishes no public
  API, developer portal, SDKs, or technical documentation, so no API artifacts could be enriched.
